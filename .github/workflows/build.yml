name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/MunicipalElections -c Release

  firestore-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm test

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: frontend/MunicipalCompanion
    steps:
      - uses: actions/checkout@v4
      - name: Build for the iPhone 16 and iPad Air simulators
        run: |
          xcodebuild -project MunicipalCompanion.xcodeproj -scheme MunicipalCompanion \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build
